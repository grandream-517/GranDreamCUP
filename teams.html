  .bar { display:flex; justify-content:space-between; padding:clamp(14px,3vh,28px) clamp(16px,3vw,40px); font-size:.9rem; letter-spacing:.16em; }
  .bar a { text-decoration:none; padding-bottom:4px; border-bottom:1px solid rgba(255,255,255,.4); text-shadow:0 1px 8px rgba(8,20,42,.6); }

  .title { text-align:center; padding:clamp(40px,10vh,100px) 20px clamp(32px,7vh,64px); }
  .title h1 { font-size:clamp(2.2rem,9vw,4rem); font-weight:300; letter-spacing:.32em; text-indent:.32em; text-shadow:0 0 28px rgba(205,189,255,.55); }
  .title p { margin-top:14px; color:var(--mint); letter-spacing:.14em; font-size:clamp(.85rem,3.4vw,1rem); }

  main { max-width:1100px; margin:0 auto; padding:0 clamp(16px,4vw,32px) 80px; }
  section + section { margin-top:clamp(56px,10vh,96px); }
  h2 { text-align:center; font-size:clamp(1.3rem,5vw,1.7rem); font-weight:400; letter-spacing:.3em; text-indent:.3em; }
  h2::after { content:'✦'; display:block; margin-top:8px; color:var(--pink); font-size:.9rem; letter-spacing:0; text-indent:0; }
  .lead { margin:16px auto 0; max-width:36em; text-align:center; color:var(--mute); font-size:.92rem; }

  .card { background:rgba(255,255,255,.055); border:1px solid var(--line); border-radius:14px; padding:20px; backdrop-filter:blur(6px); }
  .card h3 { font-size:1.05rem; font-weight:600; letter-spacing:.12em; margin-bottom:12px; color:var(--lav); }

  footer { text-align:center; padding:40px 20px calc(32px + env(safe-area-inset-bottom,0px)); font-size:.75rem; color:var(--mute); }


.tt-container {
  display: flex;
  justify-content: center; 
  width: 100%;
  box-sizing: border-box;
}


.tt-img {
  aspect-ratio: 16 / 9;
  width: min(100%, calc(52vh * 16 / 9));
  width: min(100%, calc(52svh * 16 / 9));
  flex-shrink: 0;          
  border-radius: 14px;
  overflow: hidden;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #bae6fd, #e0f2fe);
  color: #64748b;
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  transition: background 0.4s;
}

.tt-img img { 
  width: 100%; 
  height: 100%; 
  object-fit: cover; 
  display: block; 
}
